services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drd
      POSTGRES_PASSWORD: drd
      POSTGRES_DB: drd
    ports:
      # Only for running tests from the host. Bound to localhost (not the LAN); override the port with
      # DB_PORT if 5432 is already taken by a local Postgres. Nothing in the compose network needs it.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP. On a fresh volume the image first runs a temporary init server on the
      # Unix socket only; a socket check reports "healthy" too early and the api's TCP connect is refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U drd -d drd"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://drd:drd@db:5432/drd
      # dev default only; set JWT_SECRET (>= 32 bytes) in the environment for any real deployment
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
    volumes:
      - ./seed:/seed:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"   # direct API access (/docs); the UI goes through web on 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
