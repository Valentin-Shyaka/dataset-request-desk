services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drd
      POSTGRES_PASSWORD: drd
      POSTGRES_DB: drd
    ports:
      - "5432:5432"   # exposed so tests can run from the host; would not be exposed in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drd -d drd"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
